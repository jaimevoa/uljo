<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To ULJO · a small game</title>
<meta name="description" content="How Jaime and Evi came to ULJO: fly their ship from the cockpit. W A S D to fly up, left, down and right, space to shoot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap">
<style>
  :root{--blue:#4A9BD3;--space:#050817}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--space);overflow:hidden}
  body{
    font-family:"Lexend","SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-.015em;
    color:#fff;-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  /* the cockpit fills the window; the words live in the DOM so they keep the site's face */
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;inset:0;pointer-events:none}
  .ui > *{position:absolute}

  .back{
    position:fixed;left:2.2857rem;top:2.2857rem;z-index:5;
    display:flex;align-items:center;justify-content:center;
    width:2.75rem;height:2.75rem;border:1px solid rgba(255,255,255,.35);border-radius:50%;
    background:rgba(14,14,16,.72);backdrop-filter:blur(1.5rem) saturate(1.5);-webkit-backdrop-filter:blur(1.5rem) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.05),0 .5rem 1.5rem rgba(0,0,0,.35);
    color:#fff;text-decoration:none;transition:transform .4s cubic-bezier(.2,.7,.2,1);
  }
  .back svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .back:hover{transform:scale(1.1)}

  /* the story: centred, at the top of the canopy (pass 75: it was in the bottom corner, over the dashboard) */
  .story{left:50%;top:10%;transform:translateX(-50%);width:min(52rem,86%);text-align:center;font-size:clamp(16px,1.55vw,24px);line-height:1.45;letter-spacing:-.015em;font-weight:300;
    text-shadow:0 2px 14px rgba(0,0,0,.85);text-wrap:pretty}
  .story p+p{margin-top:.9em}
  .story .fire{font-weight:700;color:#fff}
  .px,.story h2,.story .fire,.go,.hud,.clock,.evi,.lost{font-family:"Space Grotesk","Lexend",system-ui,sans-serif;letter-spacing:-.05em!important}
  .story h2{font-size:1.3em;font-weight:600;color:var(--blue);margin-bottom:.5em;letter-spacing:-.06em!important}
  .story .fire{font-size:2.3em;line-height:1.05;margin-top:.55em!important;text-shadow:0 0 1.2em rgba(255,170,90,.55),0 2px 14px rgba(0,0,0,.85)}      /* bigger, and white */
  .story .keys{display:flex;flex-direction:column;align-items:center;gap:.45em;margin-top:.4em}
  .story kbd{display:inline-block;min-width:1.6em;padding:.1em .45em;margin-right:.2em;border:1px solid rgba(255,255,255,.5);border-radius:.3em;
    font:inherit;font-size:.85em;font-weight:600;text-align:center;background:rgba(255,255,255,.08)}
  /* pass 77: a button takes you on (it was a blinking "Press space to continue"): white, like every button of the world, its key on it */
  .go{left:50%;transform:translateX(-50%);bottom:24%;display:inline-flex;align-items:center;gap:.65rem;height:3.1rem;padding:0 1.9rem;border:0;border-radius:99rem;
    background:#fff;color:#0b0b0d;font-size:1.05rem;font-weight:600;line-height:1;letter-spacing:-.04em;white-space:nowrap;cursor:pointer;pointer-events:auto;
    box-shadow:0 .6rem 1.8rem rgba(0,0,0,.5);animation:goIn .5s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
  .go:hover{transform:translateX(-50%) scale(1.05)}
  .go:active{transform:translateX(-50%) scale(.97)}
  .go kbd{display:inline-grid;place-items:center;height:1.9rem;padding:0 .6rem;border-radius:99rem;background:#0b0b0d;color:#fff;font:inherit;font-size:.74rem;font-weight:600;letter-spacing:0}
  @keyframes goIn{from{opacity:0;transform:translateX(-50%) translateY(.5rem)}to{opacity:1;transform:translateX(-50%)}}
  @media (hover:none){.go kbd{display:none}.go{padding:0 1.7rem}}
  .story .mis{margin-top:1.1em}
  .story .mis__line{font-weight:600;color:#fff}
  @keyframes goBlink{0%,55%{opacity:1}56%,100%{opacity:.25}}
  .caret{display:inline-block;width:.45em;height:1em;background:#fff;vertical-align:-.15em;animation:goBlink .9s steps(1,end) infinite}

  /* the score, the clock, the hearts */
  .hud{right:3.5%;top:2.6rem;text-align:right;font-size:clamp(12px,1.05vw,17px);font-weight:600;line-height:1.4;
    text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .hud b{color:var(--blue);font-variant-numeric:tabular-nums}
  .clock{left:50%;top:2.1rem;transform:translateX(-50%);font-size:clamp(20px,2.1vw,34px);font-weight:700;font-variant-numeric:tabular-nums;
    text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .hearts{left:6.4rem;top:2.75rem;display:flex;gap:.4rem}
  .hearts svg{width:1.75rem;height:1.75rem;fill:#ff4b5c;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));transition:opacity .3s,transform .3s}
  .hearts svg.is-gone{opacity:.18;transform:scale(.8)}
  /* where the lasers go */
  .aim{left:50%;top:50%;width:2.6rem;height:2.6rem;margin:-1.3rem 0 0 -1.3rem;border:2px solid rgba(127,214,255,.8);border-radius:50%;
    box-shadow:0 0 1rem rgba(74,155,211,.6)}
  .aim::before,.aim::after{content:"";position:absolute;left:50%;top:50%;background:rgba(127,214,255,.9)}
  .aim::before{width:2px;height:.7rem;margin:-.35rem 0 0 -1px}.aim::after{width:.7rem;height:2px;margin:-1px 0 0 -.35rem}

  /* Evi's word, by her on the dashboard */
  .evi{font-size:clamp(13px,1.25vw,20px);font-weight:600;width:max-content;max-width:min(24rem,62vw);text-align:center;text-wrap:balance;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.7);
    transform:translate(-50%,-100%)}
  .lost{left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(30px,4.6vw,72px);font-weight:700;white-space:nowrap;text-shadow:0 2px 14px rgba(0,0,0,.8)}
  .lost small{display:block;margin-top:.7em;font-size:.34em;font-weight:600;color:var(--blue)}

  #hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,60,80,0) 45%,rgba(255,40,70,.55) 100%);transition:opacity .5s ease}
  #hurt.on{opacity:1;transition:none}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
  #fade.on{opacity:1}
  #fade.from{opacity:1;transition:none}
  [hidden]{display:none!important}
  @media (max-width:48em){.story{width:92%;top:9%}.hearts{left:5.6rem}.go{bottom:27%}}
</style>
</head>
<body>
<a class="back" href="index.html" aria-label="Back to the menu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
</a>

<canvas id="c" aria-label="Space, from the cockpit of Jaime and Evi's ship: space-ghosts and asteroids coming"></canvas>
<div class="ui" aria-live="polite">
  <div class="story" id="story" hidden></div>
  <button class="go" id="go" type="button" hidden><span>Play</span></button>
  <div class="clock" id="clock" hidden>20</div>
  <div class="hud" id="hud" hidden><b id="kills">0</b></div>
  <div class="hearts" id="hearts" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.2 8 2 4 5.8 4c2.2 0 3.6 1.200 6.200 3.800C14.600 5.200 16 4 18.200 4 22 4 23.800 8 22 11.700 19.500 16.400 12 21 12 21z"/></svg><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.2 8 2 4 5.8 4c2.2 0 3.6 1.200 6.200 3.800C14.600 5.200 16 4 18.200 4 22 4 23.800 8 22 11.700 19.500 16.400 12 21 12 21z"/></svg><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.2 8 2 4 5.8 4c2.2 0 3.6 1.200 6.200 3.800C14.600 5.200 16 4 18.200 4 22 4 23.800 8 22 11.700 19.500 16.400 12 21 12 21z"/></svg><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.2 8 2 4 5.8 4c2.2 0 3.6 1.200 6.200 3.800C14.600 5.200 16 4 18.200 4 22 4 23.800 8 22 11.700 19.500 16.400 12 21 12 21z"/></svg><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.2 8 2 4 5.8 4c2.2 0 3.6 1.200 6.200 3.800C14.600 5.200 16 4 18.200 4 22 4 23.800 8 22 11.700 19.500 16.400 12 21 12 21z"/></svg>
  </div>
  <div class="aim" id="aim" hidden></div>
  <div class="evi" id="evi" hidden></div>
  <div class="lost" id="lost" hidden>Game over<small>Press space to try again</small></div>
</div>
<div id="hurt"></div>
<div id="fade" class="from"></div>

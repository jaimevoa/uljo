<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To ULJO · the small game, in 2D (kept for the record)</title>
<meta name="description" content="Fly Jaime and Evi to ULJO. WASD to move, space to shoot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap">
<style>
  :root{--blue:#4A9BD3;--space:#050817}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--space);overflow:hidden}
  body{
    font-family:"Space Grotesk","SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-.07em;
    color:#fff;-webkit-font-smoothing:antialiased;
  }
  /* the world: 800 x 450 drawn small, blown up in whole pixels */
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  #frame{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges}
  /* words live in the DOM so they keep the site's face, crisp */
  .ui{position:absolute;inset:0;pointer-events:none}
  .ui > *{position:absolute}

  /* the back button — the same black glass circle as the site */
  .back{
    position:fixed;left:2.2857rem;top:2.2857rem;z-index:5;
    display:flex;align-items:center;justify-content:center;
    width:2.75rem;height:2.75rem;border:1px solid rgba(255,255,255,.35);border-radius:50%;
    background:rgba(14,14,16,.72);backdrop-filter:blur(1.5rem) saturate(1.5);-webkit-backdrop-filter:blur(1.5rem) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.05),0 .5rem 1.5rem rgba(0,0,0,.35);
    color:#fff;text-decoration:none;transition:transform .4s cubic-bezier(.2,.7,.2,1);
  }
  .back svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .back:hover{transform:scale(1.1)}

  /* the story, bottom left */
  .story{left:5%;bottom:9%;max-width:44%;font-size:clamp(14px,1.35vw,21px);line-height:1.35;letter-spacing:-.07em;
    text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .story p+p{margin-top:.9em}
  .story .fire{font-weight:700;color:var(--blue)}
  .story h2{font-size:1.15em;font-weight:700;color:var(--blue);margin-bottom:.5em;letter-spacing:-.07em}
  .story .keys{display:flex;flex-direction:column;gap:.45em;margin-top:.4em}
  .story kbd{display:inline-block;min-width:1.6em;padding:.1em .45em;margin-right:.2em;border:1px solid rgba(255,255,255,.5);border-radius:.3em;
    font:inherit;font-size:.85em;font-weight:600;text-align:center;background:rgba(255,255,255,.08)}
  .go{left:5%;bottom:4.5%;font-size:clamp(12px,1vw,16px);font-weight:600;color:var(--blue);letter-spacing:-.07em;
    animation:goBlink 1.1s steps(1,end) infinite}
  @keyframes goBlink{0%,55%{opacity:1}56%,100%{opacity:.25}}
  .caret{display:inline-block;width:.45em;height:1em;background:#fff;vertical-align:-.15em;animation:goBlink .9s steps(1,end) infinite}

  /* the score line, top */
  .hud{right:3.5%;top:5.5%;text-align:right;font-size:clamp(12px,1.05vw,17px);font-weight:600;letter-spacing:-.07em;line-height:1.4;
    text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .hud b{color:var(--blue);font-variant-numeric:tabular-nums}
  .clock{left:50%;top:5.5%;transform:translateX(-50%);font-size:clamp(14px,1.4vw,22px);font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-.07em;text-shadow:0 2px 10px rgba(0,0,0,.7)}

  /* Evi's word, over the ship — the menu's style */
  .evi{font-size:clamp(11px,.85vw,14px);font-weight:600;letter-spacing:-.07em;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.6);
    transform:translate(-50%,-100%)}
  .evi .caret{background:#fff}

  .lost{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(18px,2vw,30px);font-weight:700;letter-spacing:-.07em}
  .lost small{display:block;margin-top:.6em;font-size:.55em;font-weight:600;color:var(--blue)}

  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
  #fade.on{opacity:1}
  [hidden]{display:none!important}
</style>
</head>
<body>
<a class="back" href="index.html" aria-label="Back to the menu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
</a>

<div id="stage">
  <div id="frame">
    <canvas id="c" width="800" height="450" aria-label="Space: Jaime and Evi's ship flying right, space-ghosts and asteroids coming"></canvas>
    <div class="ui" aria-live="polite">
      <div class="story" id="story" hidden></div>
      <div class="go" id="go" hidden>Press space to continue</div>
      <div class="clock" id="clock" hidden>30</div>
      <div class="hud" id="hud" hidden>Space-ghosts <b id="kills">0</b></div>
      <div class="evi" id="evi" hidden></div>
      <div class="lost" id="lost" hidden>Lost in space…<small>Press space to try again</small></div>
    </div>
  </div>
</div>
<div id="fade"></div>

<script src="assets/js/game.js?v=3"></script>
<script src="assets/js/feel.js?v=71" data-no-smooth></script>
</body>
</html>

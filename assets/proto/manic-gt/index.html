<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Manic GT</title>
<meta name="description" content="Écran central Manic GT : prototype interactif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&display=block">
<style>
/* Manic GT centre screen. One 1280×832 canvas (the car's display) scaled to fit the window.
   Dark single theme: black bezel + side rail, a warm copper "glass" glow, a charcoal panel holding the views.
   Spacing on an 8 px grid (8 / 16 / 24 / 32 / 48). Space Grotesk everywhere, tracking −8 %. */
:root{
  color-scheme:dark;
  --void:#000000;          /* bezel, rail */
  --panel:#1C1B1A;         /* main panel (warm charcoal) */
  --card:#0C0C0B;          /* cards on the panel */
  --raise:#2A2927;         /* buttons, keys, rows */
  --raise-2:#363532;       /* hover / pressed */
  --line:rgba(255,255,255,.08);
  --ink:#F3F0EC;           /* primary text */
  --ink-2:#B6B5B3;         /* secondary text (from the Figma file) */
  --ink-3:#7C7A76;         /* tertiary text, idle icons */
  --accent:#DB431E;        /* Manic orange */
  --accent-hi:#F05A33;
  --accent-ink:#FFFFFF;
  --pill:#E3DEDB;          /* search pill, place cards (light surfaces) */
  --pill-ink:#3E3C3A;
  --pill-ink-2:#6E6B67;
  --ok:#22B04B; --ok-ink:#0F7A2B; --ok-soft:rgba(34,176,75,.16);
  --bad:#E0342C; --bad-soft:rgba(224,52,44,.18);
  --font:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --track:-0.08em;
  --r-xl:40px; --r-lg:24px; --r-md:16px; --r-sm:12px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --hud:rgba(18,18,17,.92); --hud-line:rgba(255,255,255,.14); --bar:#121211; --modal:#232220; --sheet:rgba(16,16,15,.97);
  --note:#211f1d; --toast:#2a2826; --card2:#191917; --track-bg:#3A3936; --glass-veil:rgba(0,0,0,0);
}
html,body{height:100%}
body{background:#000;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;letter-spacing:var(--track)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:var(--track)}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
img{max-width:none;display:block}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:0;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;display:inline-block;width:1em;height:1em;overflow:hidden;flex:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.ico{width:24px;height:24px;fill:currentColor;flex:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
#app{position:fixed;inset:0;background:var(--void);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:832px;transform-origin:center;transform:translate(-50%,-50%);border-radius:48px;overflow:hidden;background:var(--void)}

/* ---------- rail ---------- */
.rail{position:absolute;left:0;top:0;bottom:0;width:112px;display:flex;flex-direction:column;align-items:center;padding:40px 0 40px}
.clock{height:32px;display:flex;align-items:center;font-size:20px;font-weight:600}
.rail-nav{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding-top:40px;width:100%;position:relative}
.rail-btn{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:var(--ink);position:relative;transition:color .25s,background .25s}
.rail-btn .ms{font-size:36px}
.rail-btn:hover{background:rgba(255,255,255,.05)}
.rail-btn.on{color:var(--accent)}
.rail-btn .dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--void);display:none}
.rail-btn.live .dot{display:block}
.rail-mark{position:absolute;left:0;width:4px;height:48px;border-radius:0 4px 4px 0;background:var(--accent);transition:transform .45s var(--ease),opacity .3s;top:0}

/* ---------- glass + panel ---------- */
.glass{position:absolute;left:112px;top:16px;right:16px;bottom:16px;border-radius:var(--r-xl);background:#140d0a url(img/bg.jpg) center/cover;overflow:hidden}
.glass::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(0,0,0,0) 40%,rgba(0,0,0,.25));pointer-events:none}
.grabber{position:absolute;top:0;left:50%;width:160px;height:24px;margin-left:-80px;display:grid;place-items:center;z-index:5}
.grabber i{display:block;width:72px;height:5px;border-radius:3px;background:rgba(255,255,255,.45);transition:background .2s,width .2s}
.grabber:hover i{background:rgba(255,255,255,.8);width:88px}
.panel{position:absolute;left:24px;top:24px;right:24px;bottom:24px;border-radius:var(--r-lg);background:var(--panel);overflow:hidden;box-shadow:0 24px 48px rgba(0,0,0,.35);z-index:1}
.content{position:absolute;left:0;top:0;right:0;bottom:96px;transition:bottom .35s var(--ease)}
.panel.full .content{bottom:0}
.view{position:absolute;inset:0;padding:24px;overflow:hidden;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .28s var(--ease),transform .35s var(--ease),visibility 0s .35s}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s var(--ease),transform .35s var(--ease),visibility 0s}
.view.flush{padding:0}

/* ---------- shared bits ---------- */
.h1{font-size:32px;font-weight:600;line-height:1.1}
.h2{font-size:24px;font-weight:600;line-height:1.15}
.h3{font-size:20px;font-weight:600;line-height:1.2}
.t-body{font-size:16px;line-height:1.35}
.t-sm{font-size:14px;line-height:1.35;color:var(--ink-2)}
.t-xs{font-size:12px;line-height:1.3;color:var(--ink-3)}
.press{transition:transform .12s var(--ease),background .2s,color .2s,opacity .2s}
.press:active{transform:scale(.96)}
.btn{height:56px;padding:0 24px;border-radius:28px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:600;background:var(--raise);color:var(--ink)}
.btn:hover{background:var(--raise-2)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.accent:hover{background:var(--accent-hi)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{height:40px;padding:0 16px;font-size:15px;border-radius:20px}
.btn.outline{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.btn.outline.on{background:var(--accent);box-shadow:none}
.icon-btn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--raise);color:var(--ink)}
.icon-btn:hover{background:var(--raise-2)}
.icon-btn.ghost{background:transparent}
.icon-btn.ghost:hover{background:rgba(255,255,255,.06)}
.icon-btn.sm{width:40px;height:40px}
.icon-btn.accent{background:var(--accent);color:#fff}
.icon-btn.on{background:var(--accent);color:#fff}
.seg{display:inline-flex;padding:4px;border-radius:28px;background:var(--raise);gap:4px}
.seg button{height:48px;padding:0 24px;border-radius:24px;font-size:17px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
.seg button.on{background:var(--accent);color:#fff}
.seg button:not(.on):hover{color:var(--ink)}
.switch{width:56px;height:32px;border-radius:16px;background:var(--raise-2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(24px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p),var(--track-bg) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p),var(--track-bg) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--accent);margin-top:-8px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:5px solid var(--accent)}
.av{border-radius:50%;background:#2c2b29;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
.av img{width:100%;height:100%;object-fit:cover}
.av.lea{background:#E8875D}.av.maya{background:#A85BE0}.av.noah{background:#4C9BE8}.av.felix{background:#57B45E}.av.me{background:var(--accent)}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:432px 1fr;grid-template-rows:1fr 1fr;gap:24px;height:100%}
.tile{position:relative;border-radius:var(--r-lg);background:var(--card);overflow:hidden;text-align:left;display:block;width:100%;height:100%}
.tile .label{position:absolute;left:24px;bottom:24px;display:flex;align-items:center;gap:12px;font-size:24px;font-weight:600;z-index:2}
.tile .label .ms{font-size:32px}
.tile .go{position:absolute;right:24px;bottom:24px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--ink-2);z-index:2;transition:background .2s,color .2s}
.tile:hover .go{background:var(--accent);color:#fff}
.tile-nav{grid-row:1 / span 2}
.mini-map{position:absolute;inset:0;overflow:hidden}
.mini-map img{position:absolute;width:1280px;height:1280px;left:-179px;top:-484px;opacity:.95}
.tile-nav::after{content:"";position:absolute;inset:auto 0 0;height:160px;background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:1}
.me-dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #fff,0 4px 12px rgba(0,0,0,.5)}
.me-dot::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(219,67,30,.35);animation:ping 2.2s infinite}
@keyframes ping{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.eta-chip{position:absolute;left:24px;top:24px;z-index:2;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:var(--hud);font-size:15px;font-weight:600}
.eta-chip .ms{font-size:20px;color:var(--accent)}
.contacts-row{position:absolute;left:24px;right:24px;top:32px;display:flex;justify-content:space-between;padding:0 24px}
.contact{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink-2)}
.contact .av{width:80px;height:80px;transition:transform .2s var(--ease),box-shadow .2s}
.contact:hover .av{transform:translateY(-2px);box-shadow:0 0 0 3px var(--accent)}

.callout{position:absolute;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600;color:var(--ink);z-index:2;white-space:nowrap}
.callout:hover{background:rgba(255,255,255,.16)}
.callout.on{background:var(--accent);color:#fff}
.callout i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.callout.on i{background:#fff}
.leaders{position:absolute;inset:0;pointer-events:none;z-index:1}
.leaders path{fill:none;stroke:rgba(255,255,255,.45);stroke-width:1.25}
.leaders circle{fill:#fff}

/* ---------- player ---------- */
.player{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--bar);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 448px 1fr;align-items:center;padding:0 24px;gap:24px;transition:transform .35s var(--ease)}
.panel.full .player{transform:translateY(100%)}
.np{display:flex;align-items:center;gap:16px;min-width:0;text-align:left;border-radius:12px}
.cover{width:56px;height:56px;border-radius:8px;overflow:hidden;flex:none;background:#333 center/cover;display:grid;place-items:center;font-weight:700;font-size:18px;color:rgba(255,255,255,.9)}
.np-txt{min-width:0}
.np-title{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{display:block;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ctrl{display:flex;flex-direction:column;gap:4px}
.ctrl-row{display:flex;justify-content:center;align-items:center;gap:16px}
.pbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative}
.pbtn:hover{background:rgba(255,255,255,.07)}
.pbtn .ms{font-size:26px}
.pbtn.dim{color:var(--ink-3)}
.pbtn.lit{color:var(--accent)}
.pbtn.lit::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.pbtn.play{background:var(--ink);color:var(--panel);width:40px;height:40px}
.pbtn.play:hover{background:#fff}
.prog{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:12px;font-size:12px;color:var(--ink-2)}
.prog span:last-child{text-align:right}
.bar{position:relative;height:16px;cursor:pointer;display:flex;align-items:center}
.bar::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--track-bg)}
.bar b{position:absolute;left:0;height:4px;border-radius:2px;background:var(--accent);width:var(--p,0%)}
.bar b::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--accent)}
.p-right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.spot{height:40px;padding:0 16px 0 8px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.spot:hover{background:rgba(255,255,255,.07)}
.spot svg{width:24px;height:24px}

/* ---------- map ---------- */
.map{position:absolute;inset:0;overflow:hidden;background:#1d1d1d;cursor:grab;touch-action:none}
.map.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1280px;height:1280px;transform-origin:0 0}
.world.anim{transition:transform .8s var(--ease)}
.world>img{width:1280px;height:1280px;pointer-events:none}
.world svg.route{position:absolute;inset:0;width:1280px;height:1280px;pointer-events:none;overflow:visible}
.route .alt{fill:none;stroke:#8b8984;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.route .main-c{fill:none;stroke:#7a2a12;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.route .main{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.route .done{fill:none;stroke:#8b8984;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.mk{position:absolute;left:0;top:0;transform-origin:0 0}
.mk-inner{transform:translate(-50%,-50%)}
.pin{width:40px;height:40px;transform:translate(-50%,-92%)!important;color:var(--accent);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.pin .ms{font-size:40px}
.car-mk{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.6)}
.car-mk .ms{font-size:22px;color:var(--accent);transition:transform .3s}
.map-dim{position:absolute;inset:0;background:rgba(0,0,0,.18);pointer-events:none}

.search{position:absolute;left:24px;top:24px;width:560px;height:64px;border-radius:32px;background:var(--pill);color:var(--pill-ink);display:flex;align-items:center;padding:0 8px 0 24px;gap:16px;z-index:4;box-shadow:0 12px 32px rgba(0,0,0,.35);transition:width .35s var(--ease),border-radius .25s}
.search .ms{font-size:28px;color:var(--pill-ink)}
.search .q{flex:1;font-size:22px;font-weight:500;color:var(--pill-ink-2);text-align:left;height:100%;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.search .q.typed{color:var(--pill-ink)}
.caret{display:inline-block;width:2px;height:26px;background:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dir-btn{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.dir-btn .ms{color:#fff;font-size:28px}
.search.open{width:1056px;border-radius:32px 32px 0 0}
.chips{position:absolute;left:24px;top:104px;display:flex;gap:12px;z-index:3;transition:opacity .2s}
.chip{height:40px;padding:0 16px;border-radius:20px;background:var(--pill);color:var(--pill-ink);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.chip .ms{font-size:20px}
.chip em{font-style:normal;color:var(--ok-ink)}
.chip:hover{background:#fff}
.mani-btn{position:absolute;right:24px;top:24px;height:64px;padding:0 20px 0 12px;border-radius:32px;background:var(--accent);display:flex;align-items:center;gap:8px;z-index:4;box-shadow:0 12px 28px rgba(219,67,30,.35)}
.mani-btn img{width:48px;height:32px}
.mani-btn .ms{font-size:28px;color:#fff}
.mani-btn:hover{background:var(--accent-hi)}
.zoom{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:3}
.zoom .stack{display:flex;flex-direction:column;border-radius:28px;background:var(--pill);overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.zoom .stack button{width:56px;height:56px;display:grid;place-items:center;color:var(--pill-ink)}
.zoom .stack button+button{border-top:1px solid rgba(0,0,0,.12)}
.zoom .stack button:hover{background:#fff}
.zoom .solo{width:56px;height:56px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.zoom .solo:hover{background:#fff}
.zoom .solo.on{color:var(--accent)}

/* search results + keyboard */
.results{position:absolute;left:24px;top:88px;width:1056px;background:var(--pill);border-radius:0 0 24px 24px;z-index:4;color:var(--pill-ink);padding:0 24px 8px;box-shadow:0 18px 32px rgba(0,0,0,.35)}
.res{display:flex;align-items:center;gap:16px;width:100%;padding:12px 0;text-align:left;border-top:1px solid rgba(0,0,0,.1)}
.res:first-child{border-top-color:rgba(0,0,0,.18)}
.res .ms{font-size:24px;color:var(--pill-ink-2)}
.res b{font-size:18px;font-weight:600;color:#1f1e1c}
.res small{display:block;font-size:13px;color:var(--pill-ink-2);margin-top:2px}
.res small i{font-style:normal;color:var(--bad)}
.res small i.open{color:var(--ok-ink)}
.res:hover b{color:var(--accent)}
.res-empty{padding:16px 0;font-size:15px;color:var(--pill-ink-2);border-top:1px solid rgba(0,0,0,.18)}
.kbd{position:absolute;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:24px;display:grid;grid-template-columns:repeat(24,1fr);gap:8px;z-index:5;transform:translateY(100%);transition:transform .35s var(--ease)}
.kbd.on{transform:none}
.key{height:52px;border-radius:12px;background:var(--raise);font-size:20px;font-weight:600;display:grid;place-items:center;grid-column:span 2;color:var(--ink)}
.key:hover{background:var(--raise-2)}
.key:active{background:#4a4844}
.key.w3{grid-column:span 3}.key.w4{grid-column:span 4}.key.w5{grid-column:span 5}.key.w8{grid-column:span 8}.key.w11{grid-column:span 11}.key.w1{grid-column:span 1;visibility:hidden}
.key.acc{background:var(--accent);color:#fff}
.key.light{background:#ECE8E4;color:#1b1b1b}
.key .ms{font-size:24px}

/* floating map cards */
.fcard{position:absolute;top:24px;bottom:24px;width:400px;border-radius:24px;background:var(--pill);color:var(--pill-ink);z-index:4;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.4);transition:transform .4s var(--ease),opacity .3s}
.fcard.left{left:24px}
.fcard.right{right:24px}
.fcard.hide{opacity:0;pointer-events:none}
.fcard.left.hide{transform:translateX(-24px)}
.fcard.right.hide{transform:translateX(24px)}
.fhead{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 12px;min-height:64px}
.fhead .t{flex:1;font-size:20px;font-weight:600;color:#1f1e1c;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--pill-ink)}
.fbtn:hover{background:rgba(0,0,0,.07)}
.fphoto{height:176px;flex:none;background:#bbb center/cover;position:relative}
.fphoto.ph{display:grid;place-items:center;background:#cfc9c4;color:#8d8781}
.fphoto.ph .ms{font-size:64px}
.fbody{padding:20px 24px 8px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
.fname{font-size:24px;font-weight:600;color:#1f1e1c;display:flex;align-items:center;gap:8px}
.fname .ms{font-size:22px;color:#2f6fdf}
.fmeta{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--pill-ink-2)}
.fmeta div{display:flex;align-items:center;gap:8px}
.fmeta .ms{font-size:18px}
.fmeta .open{color:var(--ok-ink);font-weight:600}
.fmeta .closed{color:var(--bad);font-weight:600}
.cat{font-size:14px;font-weight:600;color:var(--pill-ink-2)}
.ffoot{display:flex;align-items:center;gap:12px;padding:16px 24px 24px}
.ffoot .grow{flex:1}
.fcircle{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#cfc9c4;color:var(--pill-ink)}
.fcircle:hover{background:#c2bbb5}
.fcircle.accent{background:var(--accent);color:#fff}
.fcircle.on{background:#1f1e1c;color:#fff}
.mani-pill{height:56px;padding:0 20px 0 12px;border-radius:28px;background:var(--accent);display:flex;align-items:center;gap:8px;color:#fff}
.mani-pill img{width:44px;height:30px}
.mani-pill:hover{background:var(--accent-hi)}
.fromto{margin:0 24px;padding:16px;border-radius:16px;background:rgba(0,0,0,.06);display:grid;grid-template-columns:24px 1fr;gap:4px 12px;align-items:center;font-size:16px;font-weight:600;color:#1f1e1c}
.fromto .d1{width:12px;height:12px;border-radius:50%;background:var(--accent);justify-self:center;box-shadow:0 0 0 3px rgba(219,67,30,.25)}
.fromto .dl{width:2px;height:16px;justify-self:center;background:repeating-linear-gradient(#8d8781 0 3px,transparent 3px 6px)}
.fromto .ms{font-size:22px;color:#1f1e1c;justify-self:center}
.opts{padding:16px 24px 0;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.06);text-align:left;border:2px solid transparent}
.opt b{font-size:22px;font-weight:700;color:#1f1e1c}
.opt small{grid-column:1;font-size:13px;color:var(--pill-ink-2)}
.opt .tag{grid-row:1 / span 2;grid-column:2;font-size:12px;font-weight:700;color:var(--ok-ink);background:rgba(15,122,43,.12);padding:4px 10px;border-radius:12px}
.opt.on{border-color:var(--accent);background:#fff}
.opt:hover:not(.on){background:rgba(0,0,0,.1)}
.ffoot .btn{height:56px;flex:1;padding:0 16px}
.btn.dark{background:#1f1e1c;color:#fff}
.btn.dark img{width:36px;height:24px}
.btn.dark:hover{background:#000}
.guide-img{height:208px;flex:none;background:#999 center/cover;margin:0 12px;border-radius:16px}
.guide-body{padding:20px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.steps-bar{height:6px;border-radius:3px;background:rgba(0,0,0,.12);position:relative;overflow:hidden}
.steps-bar b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;transition:width .3s}
.guide-step{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;background:rgba(0,0,0,.06)}
.guide-step .ms{font-size:40px;color:var(--accent)}
.guide-step b{display:block;font-size:20px;color:#1f1e1c}
.guide-step small{font-size:14px;color:var(--pill-ink-2)}

/* ---------- drive (guidance + ManiScan) ---------- */
.drive{position:absolute;inset:0;background:#2b2b2b;overflow:hidden}
.scene{position:absolute;left:50%;top:50%;width:1106px;height:792px;transform:translate(-50%,-50%)}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .45s}
.scene .hot{position:absolute;border-radius:12px}
.scene .hot:hover{background:rgba(255,255,255,.08)}
.scene-turn img.bg{animation:roll 6s ease-in-out infinite alternate}
@keyframes roll{from{transform:scale(1)}to{transform:scale(1.03)}}
.d-card{position:absolute;background:var(--hud);border:1px solid var(--hud-line);border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:3}
.turn{left:24px;top:24px;width:440px;padding:20px 24px;display:flex;gap:20px;align-items:center}
.turn .ms{font-size:72px;color:var(--accent);font-variation-settings:"FILL" 0,"wght" 600,"GRAD" 0,"opsz" 48}
.turn .dist{font-size:32px;font-weight:600;color:var(--ink-2)}
.turn .road{font-size:28px;font-weight:600;margin-top:4px;line-height:1.1}
.turn .next{font-size:14px;color:var(--ink-3);margin-top:8px}
.d-left{position:absolute;left:24px;bottom:24px;display:flex;flex-direction:column;gap:12px;z-index:3;width:296px}
.d-row{display:flex;gap:12px}
.d-left .d-card{position:relative}
.quit{height:48px;padding:0 20px 0 14px;border-radius:24px;background:var(--hud);border:1px solid var(--hud-line);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.quit .ms{color:var(--accent)}
.quit:hover{background:#000}
.round{width:48px;height:48px;border-radius:50%;background:var(--hud);border:1px solid var(--hud-line);display:grid;place-items:center}
.round:hover{background:#000}
.trip{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;position:relative}
.trip b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.trip small{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.trip .batt{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.trip .batt .ms{font-size:20px}
.speed{position:absolute;right:24px;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3}
.limit{width:64px;height:64px;border-radius:50%;background:#fff;border:6px solid var(--bad);display:grid;place-items:center;color:#111;font-size:24px;font-weight:700}
.cur{width:64px;height:64px;border-radius:16px;background:var(--hud);border:1px solid var(--hud-line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:700;line-height:1}
.cur small{font-size:11px;color:var(--ink-3);font-weight:500;margin-top:2px}
.cur.over{color:var(--bad)}
.dim-toggle{position:absolute;right:24px;top:24px;z-index:3;display:flex;flex-direction:column;padding:4px;gap:4px;border-radius:28px;background:var(--hud);border:1px solid var(--hud-line)}
.dim-toggle button{width:48px;height:48px;border-radius:24px;font-size:16px;font-weight:700;color:var(--ink-2)}
.dim-toggle button.on{background:var(--accent);color:#fff}
.scan-badge{left:24px;top:24px;padding:12px 24px 12px 12px;display:flex;align-items:center;gap:12px}
.scan-badge img{width:72px;height:48px}
.scan-badge small{display:block;font-size:13px;font-weight:700;color:var(--ok)}
.scan-badge b{font-size:24px;font-weight:600}
.slot-tag{position:absolute;padding:8px 12px;border-radius:12px;background:var(--hud);border:1px solid var(--hud-line);font-size:14px;font-weight:600;white-space:nowrap;z-index:2;pointer-events:none}
.slot-tag small{display:block;font-size:12px;font-weight:700}
.slot-tag.ok small{color:var(--ok)}
.slot-tag.no small{color:var(--bad)}
.arrived{padding:20px 24px;font-size:24px;font-weight:600;display:flex;align-items:center;gap:12px}
.arrived .ms{color:var(--ok);font-size:28px}
.hand{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;display:grid;place-items:center;color:#fff;pointer-events:none;animation:tap 1.6s ease-in-out infinite}
.hand .ms{font-size:56px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
@keyframes tap{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
.begin{position:absolute;z-index:3}
.cams{position:absolute;inset:24px;display:grid;grid-template-columns:400px 1fr;grid-template-rows:1fr 1fr;gap:24px}
.cam{position:relative;border-radius:20px;overflow:hidden;background:#000}
.cam img{width:100%;height:100%;object-fit:cover}
.cam.big{grid-row:1 / span 2}
.cam label{position:absolute;left:16px;top:16px;height:32px;padding:0 12px;border-radius:16px;background:rgba(0,0,0,.6);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.cam label i{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink 1.2s steps(1) infinite}
.cam svg{position:absolute;inset:0;width:100%;height:100%}
.park-status{position:absolute;left:24px;right:24px;bottom:24px;padding:16px 20px;display:flex;align-items:center;gap:16px}
.park-status .grow{flex:1;display:flex;flex-direction:column;gap:8px}
.park-status b{font-size:18px}
.park-bar{height:6px;border-radius:3px;background:var(--track-bg);overflow:hidden}
.park-bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s linear}

/* ---------- climate ---------- */
.clim{display:grid;grid-template-rows:56px 1fr 64px;gap:24px;height:100%}
.clim-top{display:flex;align-items:center;justify-content:space-between}
.clim-top .grp{display:flex;gap:12px;align-items:center}
.tbtn{height:48px;min-width:48px;padding:0 16px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75);color:var(--ink)}
.tbtn .ms{font-size:24px}
.tbtn:hover{background:rgba(255,255,255,.06)}
.tbtn.on{background:var(--accent);box-shadow:none;color:#fff}
.tbtn.icon{padding:0}
.zones{display:flex;gap:32px}
.zones button{font-size:20px;font-weight:600;color:var(--ink-2);height:48px;position:relative}
.zones button.on{color:var(--accent)}
.zones button.on::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:2px;border-radius:1px;background:var(--accent)}
.clim-mid{display:grid;grid-template-columns:160px 1fr 160px;align-items:center}
.temp{display:flex;flex-direction:column;align-items:center;gap:8px}
.temp .v{font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.temp .u{font-size:18px;color:var(--ink-2);margin-top:-4px}
.temp .who{font-size:13px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:0}
.chev{width:56px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--accent)}
.chev .ms{font-size:40px}
.chev:hover{background:rgba(255,255,255,.06)}
.seats{position:relative;justify-self:center;width:420px;height:410px}

.seat-btn{position:absolute;width:96px;height:96px;margin-left:-48px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;background:rgba(20,20,19,.62);border:1.5px solid rgba(255,255,255,.18)}
.seat-btn:hover{background:rgba(20,20,19,.8)}
.seat-btn svg{width:40px;height:40px;fill:currentColor}
.seat-btn .lv{display:flex;gap:4px}
.seat-btn .lv i{width:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.seat-btn.l1 .lv i:nth-child(-n+1),.seat-btn.l2 .lv i:nth-child(-n+2),.seat-btn.l3 .lv i:nth-child(-n+3){background:var(--accent)}
.seat-btn.l1,.seat-btn.l2,.seat-btn.l3{color:var(--accent);border-color:rgba(219,67,30,.6)}
.clim-bot{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:32px}
.fan{display:flex;align-items:center;gap:16px}
.fan .ms{font-size:28px;color:var(--ink-2)}
.fan .lvl{font-size:16px;font-weight:700;width:24px;text-align:center}
.clim.off .clim-mid,.clim.off .fan,.clim.off .clim-bot .grp:last-child,.clim.off .zones{opacity:.3;pointer-events:none}
.svgi{width:32px;height:32px;fill:currentColor}

/* ---------- modal ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .25s}
.modal{width:720px;border-radius:28px;background:var(--modal);border:1px solid var(--line);padding:32px;box-shadow:0 32px 64px rgba(0,0,0,.5);transform:translateY(12px) scale(.98);transition:transform .3s var(--ease)}
.scrim.on .modal{transform:none}
.m-head{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.m-head .h1{flex:1}
.m-body{display:flex;flex-direction:column;gap:24px;align-items:center}
.wheel-wrap{display:flex;align-items:center;gap:16px;padding:16px 24px;border-radius:20px;background:var(--card2);border:1px solid var(--line)}
.wheel{height:168px;width:88px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:56px;display:grid;place-items:center;font-size:36px;font-weight:600;scroll-snap-align:center;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wheel div.sel{color:var(--ink)}
.wheel .pad{pointer-events:none}
.colon{font-size:36px;font-weight:600}
.days{display:flex;gap:12px}
.day{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:18px;font-weight:700;display:grid;place-items:center}
.day.on{background:var(--accent);color:#fff}
.row-between{display:flex;align-items:center;justify-content:space-between;width:100%}

/* ---------- settings ---------- */
.set{display:grid;grid-template-columns:240px 1px 1fr;gap:32px;height:100%}
.set-nav{display:flex;flex-direction:column;gap:4px}
.set-nav button{height:56px;padding:0 20px;border-radius:16px;text-align:left;font-size:19px;font-weight:600;display:flex;align-items:center;gap:12px;color:var(--ink)}
.set-nav button .ms{font-size:24px;color:var(--ink-3)}
.set-nav button:hover{background:rgba(255,255,255,.05)}
.set-nav button.on{background:var(--raise);color:var(--accent)}
.set-nav button.on .ms{color:var(--accent)}
.vline{background:var(--line);border-radius:1px}
.set-pane{min-width:0;overflow:auto;padding-right:8px}
.set-title{font-size:28px;font-weight:600;margin-bottom:8px}
.set-sub{font-size:15px;color:var(--ink-2);margin-bottom:24px}
.rows{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:20px;min-height:72px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .si{width:48px;height:48px;border-radius:14px;background:var(--raise);display:grid;place-items:center;flex:none;overflow:hidden}
.srow .si img{width:36px;height:36px;object-fit:contain}
.srow .si .ms{font-size:26px}
.srow .txt{flex:1;min-width:0}
.srow .txt b{display:block;font-size:19px;font-weight:600}
.srow .txt small{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
.srow.btnrow{text-align:left;width:100%}
.slider-row{display:grid;grid-template-columns:160px 1fr 56px;align-items:center;gap:24px;min-height:72px;border-bottom:1px solid var(--line)}
.slider-row:last-child{border-bottom:0}
.slider-row b{font-size:19px;font-weight:600}
.slider-row .val{font-size:16px;font-weight:600;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.batt-big{display:flex;align-items:center;gap:24px;padding:24px;border-radius:20px;background:var(--card);margin-bottom:16px}
.batt-big .pct{font-size:56px;font-weight:600;line-height:1}
.batt-cell{flex:1;height:40px;border-radius:12px;background:#262523;position:relative;overflow:hidden}
.batt-cell b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#1c8a3b,var(--ok));border-radius:12px;transition:width .4s}
.batt-cell i{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.8}
.lock-hero{display:flex;align-items:center;gap:24px;padding:24px;border-radius:20px;background:var(--card);margin-bottom:16px}
.lock-hero .icon-btn{width:72px;height:72px}
.lock-hero .icon-btn .ms{font-size:36px}

/* ---------- phone ---------- */
.phone{display:flex;flex-direction:column;gap:24px;height:100%}
.ph-top{display:flex;align-items:center;justify-content:space-between}
.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1}
.fav{border-radius:var(--r-lg);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;position:relative}
.fav .av{width:120px;height:120px}
.fav b{font-size:22px;font-weight:600;margin-top:8px}
.fav small{font-size:15px;color:var(--ink-2)}
.fav .acts{display:flex;gap:12px;margin-top:12px}
.fav .call{background:var(--ok);color:#fff}
.fav .call:hover{background:#29c556}
.recents{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-lg);padding:8px 24px;overflow:auto;flex:1}
.rec{display:flex;align-items:center;gap:16px;min-height:72px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .av{width:48px;height:48px;font-size:18px}
.rec .txt{flex:1}
.rec b{font-size:18px;font-weight:600;display:block}
.rec b.miss{color:var(--bad)}
.rec small{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.rec small .ms{font-size:16px}
.rec .when{font-size:14px;color:var(--ink-3);margin-right:8px}
.pad{display:grid;grid-template-columns:400px 1fr;gap:24px;flex:1;min-height:0}
.pad-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
.pk{height:72px;border-radius:20px;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:600;line-height:1}
.pk small{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:4px;letter-spacing:0}
.pk:hover{background:var(--raise-2)}
.pad-side{border-radius:var(--r-lg);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
.pad-num{font-size:48px;font-weight:600;min-height:56px;font-variant-numeric:tabular-nums;text-align:center;word-break:break-all}
.pad-hint{font-size:15px;color:var(--ink-2);min-height:20px}
.pad-acts{display:flex;gap:16px}
.callbig{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.callbig .ms{font-size:36px}
.callbig.end{background:var(--bad)}
.callbig:hover{filter:brightness(1.1)}
.call-ov{position:absolute;inset:0;z-index:15;background:radial-gradient(80% 80% at 50% 30%,#3a2219,#141312 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.call-ov.on{opacity:1;visibility:visible;transition:opacity .3s}
.call-ov .av{width:160px;height:160px;font-size:56px;box-shadow:0 0 0 8px rgba(255,255,255,.06)}
.call-ov.ringing .av{animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 8px rgba(255,255,255,.06)}50%{box-shadow:0 0 0 24px rgba(34,176,75,.15)}}
.call-ov .who{font-size:40px;font-weight:600;margin-top:8px}
.call-ov .st{font-size:18px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.call-acts{display:flex;gap:24px;margin-top:24px;align-items:flex-start}
.ca{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);width:80px}
.ca .icon-btn{width:64px;height:64px}
.ca .icon-btn .ms{font-size:28px}
.call-pill{position:absolute;top:-1px;left:50%;transform:translate(-50%,-100%);height:36px;padding:0 16px;border-radius:0 0 18px 18px;background:var(--ok);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;z-index:6;transition:transform .3s var(--ease)}
.call-pill.on{transform:translate(-50%,0)}
.call-pill .ms{font-size:18px}

/* ---------- profile ---------- */
.prof{display:grid;grid-template-columns:360px 1fr;gap:24px;height:100%}
.plist{display:flex;flex-direction:column;gap:12px}
.pitem{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;background:var(--card);text-align:left;border:2px solid transparent}
.pitem .av{width:56px;height:56px;font-size:22px}
.pitem b{display:block;font-size:19px;font-weight:600}
.pitem small{font-size:14px;color:var(--ink-2)}
.pitem.on{border-color:var(--accent)}
.pitem:hover:not(.on){background:#151514}
.pitem .chk{margin-left:auto;color:var(--accent);opacity:0}
.pitem.on .chk{opacity:1}
.pitem.add{border:2px dashed rgba(255,255,255,.18);background:transparent;color:var(--ink-2)}
.pitem.add .av{background:var(--raise)}
.pdetail{border-radius:var(--r-lg);background:var(--card);padding:32px;display:flex;flex-direction:column;gap:24px}
.phead{display:flex;align-items:center;gap:24px}
.phead .av{width:96px;height:96px;font-size:40px}
.prefs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pref{padding:20px;border-radius:16px;background:var(--card2);display:flex;flex-direction:column;gap:8px}
.pref .ms{color:var(--accent);font-size:28px}
.pref b{font-size:24px;font-weight:600}
.pref small{font-size:14px;color:var(--ink-2)}
.pdetail .foot{margin-top:auto;display:flex;gap:12px}

/* ---------- control centre ---------- */
.ctl{position:relative;height:100%;border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.ctl-head{position:absolute;left:32px;top:32px;right:32px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.ctl-car{position:absolute;left:50%;top:47%;width:620px;transform:translate(-50%,-50%);image-rendering:pixelated;transition:transform .5s var(--ease)}
.ctl-stats{position:absolute;left:32px;right:32px;bottom:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;z-index:2}
.stat{padding:16px 20px;border-radius:16px;background:var(--card2);display:flex;align-items:center;gap:12px}
.stat .ms{font-size:28px;color:var(--accent)}
.stat b{display:block;font-size:20px;font-weight:600}
.stat small{font-size:13px;color:var(--ink-2)}
.ctl .callout{height:44px;padding:0 16px;border-radius:22px;font-size:15px;gap:10px}
.ctl .callout .ms{font-size:22px}
.lock-chip{height:40px;padding:0 16px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.lock-chip.open{background:var(--bad-soft);color:#ff6a5f}

/* ---------- spotify ---------- */
.sp{display:grid;grid-template-columns:360px 1fr;gap:32px;height:100%}
.sp-now{display:flex;flex-direction:column;gap:16px}
.sp-cover{width:360px;height:360px;border-radius:20px;background:#333 center/cover;display:grid;place-items:center;font-size:64px;font-weight:700;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.sp-meta{display:flex;align-items:center;gap:16px}
.sp-meta .txt{flex:1;min-width:0}
.sp-meta b{display:block;font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-meta small{font-size:16px;color:var(--ink-2)}
.heart.on{color:#1ED760}
.sp-list{display:flex;flex-direction:column;min-width:0}
.sp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sp-head .h2{display:flex;align-items:center;gap:12px}
.sp-head svg{width:32px;height:32px}
.tracks{flex:1;overflow:auto;border-radius:var(--r-lg);background:var(--card);padding:8px}
.trk{display:grid;grid-template-columns:32px 48px 1fr auto;align-items:center;gap:16px;width:100%;padding:8px 16px;border-radius:14px;text-align:left}
.trk:hover{background:var(--raise)}
.trk .n{font-size:15px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.trk .cover{width:48px;height:48px;font-size:14px}
.trk b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk small{font-size:14px;color:var(--ink-2)}
.trk .d{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.trk.on b,.trk.on .n{color:#1ED760}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:#1ED760;border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.paused .eq i{animation-play-state:paused}

/* ---------- notifications + toast ---------- */
.sheet{position:absolute;left:24px;right:24px;top:24px;bottom:24px;border-radius:var(--r-lg);z-index:18;background:var(--sheet);transform:translateY(-104%);transition:transform .45s var(--ease);display:flex;flex-direction:column;padding:32px 32px 16px}
.sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.qt{height:72px;border-radius:20px;background:var(--raise);display:flex;align-items:center;gap:12px;padding:0 20px;font-size:17px;font-weight:600;text-align:left}
.qt .ms{font-size:28px;color:var(--ink-2)}
.qt.on{background:var(--accent);color:#fff}
.qt.on .ms{color:#fff}
.nlist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}
.note{display:flex;gap:16px;align-items:center;padding:16px 20px;border-radius:20px;background:var(--note)}
.note .av,.note .ni{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--raise)}
.note .av{border-radius:50%}
.note .ni img{width:40px;height:28px}
.note .ni .ms{font-size:26px;color:var(--accent)}
.note .txt{flex:1;min-width:0}
.note b{font-size:17px;font-weight:600}
.note .tm{font-size:13px;color:var(--ink-3);margin-left:8px;font-weight:500}
.note p{margin:4px 0 0;font-size:15px;color:var(--ink-2)}
.note .acts{display:flex;gap:8px}
.sheet-pull{align-self:center;width:72px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin-top:16px}
.empty{flex:1;display:grid;place-items:center;color:var(--ink-3);font-size:17px}
.toast{position:absolute;left:50%;top:40px;z-index:30;transform:translate(-50%,-160px);visibility:hidden;min-width:360px;max-width:720px;padding:12px 12px 12px 16px;border-radius:24px;background:var(--toast);border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:12px;font-size:16px;font-weight:500;transition:transform .45s var(--ease)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast{transition:transform .45s var(--ease),visibility 0s .45s}
.toast.on{transition:transform .45s var(--ease),visibility 0s}
.toast .ms.lead{color:var(--accent);font-size:26px}
.toast .av{width:40px;height:40px}
.toast .txt{flex:1;min-width:0}
.toast .txt small{display:block;color:var(--ink-2);font-size:14px}
.toast .btn{height:40px;font-size:15px;padding:0 16px}

/* ---------- Mani assistant ---------- */
.mani-ov{position:absolute;left:24px;right:24px;bottom:24px;z-index:16;display:flex;justify-content:center;pointer-events:none;visibility:hidden;transition:visibility 0s .45s}
.mani-ov.on{visibility:visible;transition:none}
.mani-card{pointer-events:auto;width:760px;border-radius:28px;background:var(--sheet);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 48px rgba(0,0,0,.55);padding:24px;display:grid;grid-template-columns:120px 1fr;gap:24px;transform:translateY(calc(100% + 40px));transition:transform .45s var(--ease)}
.mani-ov.on .mani-card{transform:none}
.mani-bot{width:120px;height:120px;display:grid;place-items:center;position:relative}
.mani-bot img{width:120px;height:82px;animation:bob 2.4s ease-in-out infinite}
.mani-bot .bulb{position:absolute;top:-8px;right:10px;font-size:28px;color:#F2C94C;opacity:0;transition:opacity .3s}
.mani-card.think .bulb{opacity:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mani-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.mani-top{display:flex;align-items:center;gap:12px}
.mani-top b{font-size:20px;font-weight:600;flex:1}
.wave{display:flex;align-items:center;gap:4px;height:28px}
.wave i{width:4px;border-radius:2px;background:var(--accent);height:6px}
.mani-card.listen .wave i{animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:6px}50%{height:26px}}
.said{font-size:15px;color:var(--ink-3);min-height:20px}
.bubble{font-size:18px;line-height:1.4;padding:16px 20px;border-radius:20px 20px 20px 6px;background:var(--toast);min-height:58px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{height:40px;padding:0 16px;border-radius:20px;background:var(--raise);font-size:15px;font-weight:600}
.sugg button:hover{background:var(--accent);color:#fff}

/* ---------- boot ---------- */
.boot{position:absolute;inset:0;z-index:50;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .7s ease .1s}
.boot.out{opacity:0;pointer-events:none}
.boot .logo{position:relative;width:820px;height:120px;display:grid;place-items:center}
.boot .ln{position:absolute;height:1.5px;width:780px;background:var(--accent);opacity:.9}
.boot .ln.a{top:16px;left:0;animation:lnA 1.6s var(--ease) both}
.boot .ln.b{bottom:16px;right:0;animation:lnB 1.6s var(--ease) both}
@keyframes lnA{from{transform:translateX(-110%);opacity:0}to{transform:none;opacity:.9}}
@keyframes lnB{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:.9}}
.boot .word{font-size:72px;font-weight:700;letter-spacing:.02em;color:#fff;opacity:0;animation:word 1.4s ease .7s both}
@keyframes word{from{opacity:0;letter-spacing:.4em;filter:blur(8px)}to{opacity:1;letter-spacing:.02em;filter:blur(0)}}
.boot .sub{position:absolute;bottom:56px;font-size:14px;color:var(--ink-3);opacity:0;animation:fadein .6s ease 1.8s both}
@keyframes fadein{to{opacity:1}}
#stage.booting .glass{opacity:0;transform:scale(.97)}
#stage.booting .rail-btn,#stage.booting .clock{opacity:0;transform:translateX(-12px)}
.glass{transition:opacity .9s ease,transform 1s var(--ease)}
.rail-btn,.clock{transition:opacity .5s ease,transform .5s var(--ease),color .25s,background .25s}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* clipped containers must never scroll (focus can scroll an overflow:hidden box) */
#stage,.glass,.panel,.content,.view,.drive,.map,.ctl,.tile{overflow:clip}

/* ================= v2: real map, 3D ride, ManiScan ================= */
.mapcv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;background:#1f1e1c}
.mapcv.drag{cursor:grabbing}
.mini-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.credit{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--ink-3);z-index:2;pointer-events:none}
.search .q .ph{color:var(--pill-ink-2);opacity:.7;margin-left:6px}
.results{max-height:214px;overflow:auto;overscroll-behavior:contain}
.cats{display:flex;gap:8px;padding:12px 0;border-top:1px solid rgba(0,0,0,.18);flex-wrap:wrap}
.cat-chip{height:40px;padding:0 14px 0 10px;border-radius:20px;background:rgba(0,0,0,.08);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#1f1e1c}
.cat-chip .ms{font-size:20px;color:var(--accent)}
.cat-chip:hover{background:rgba(0,0,0,.14)}
.res .dist{margin-left:auto;font-size:13px;font-weight:600;color:var(--pill-ink-2);white-space:nowrap;padding-left:12px}
.res>span:nth-child(2){min-width:0}
.res b,.res small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips:empty{display:none}
.chip .x{margin-left:2px;opacity:.5;font-size:18px}
.key.w17{grid-column:span 17}.key.w4{grid-column:span 4}
.fhero{height:120px;flex:none;margin:0 12px;border-radius:16px;background:#d3cdc8;display:grid;place-items:center;color:#8d8781}
.fhero .ms{font-size:56px}
.ffoot .btn.accent{flex:1}
.zoom[hidden],.mani-btn[hidden],.search[hidden]{display:none}

/* home + control: rendered car */
.home-car{position:absolute;left:50%;top:46%;width:440px;height:220px;transform:translate(-50%,-50%);image-rendering:auto;pointer-events:none;object-fit:contain}
#ctlCv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#ctlCv.drag{cursor:grabbing}
.ctl-acts{position:absolute;right:32px;top:120px;display:flex;flex-direction:column;gap:12px;z-index:2;align-items:flex-end}
.ctl-acts .callout{position:static}
.ctl-stats{grid-template-columns:repeat(3,1fr)}
.ctl-head{pointer-events:none}.ctl-head button{pointer-events:auto}
.tile .callout{height:36px;padding:0 14px;font-size:14px}

/* climate: clean cabin */
.seats{width:420px;height:410px}
.cabin{width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.cabin .seat rect{fill:#2e2d2a;stroke:#4a4844;stroke-width:1.5;transition:fill .3s}
.cabin .seat.l1 rect{fill:#5a2a1c}.cabin .seat.l2 rect{fill:#8f3219}.cabin .seat.l3 rect{fill:#c33d1c}
.seat-btn{width:72px;height:72px;margin-left:-36px;margin-top:-36px;border-radius:20px;background:rgba(14,14,13,.55)}
.seat-btn svg{width:30px;height:30px}

/* drive */
#driveCv{position:absolute;inset:0;width:100%;height:100%;display:block}
.drive{background:#121213}
.sim{position:absolute;left:488px;right:96px;top:24px;height:64px;z-index:3;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;border-radius:20px;background:var(--hud);border:1px solid var(--hud-line)}
.sim-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:blink 1.4s steps(1) infinite}
.sim-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.sim-txt b{font-size:15px;font-weight:600;white-space:nowrap}
.sim-txt small{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.sm{padding:3px;border-radius:20px}.seg.sm button{height:34px;padding:0 12px;font-size:14px;border-radius:17px}
.sim .btn.sm{height:40px;padding:0 10px 0 14px;gap:2px}
.turn{width:440px}
.turn .road{font-size:26px}
.d-left{width:auto;align-items:flex-start}
.trip{width:296px}
.cur span{display:block}
#tags{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.ztag{position:absolute;left:0;top:0;pointer-events:auto;height:36px;padding:0 14px 0 10px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap;background:var(--hud);border:1.5px solid var(--hud-line);color:var(--ink);transition:opacity .25s,border-color .2s,background .2s;will-change:transform}
.ztag::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:var(--lead,14px);background:rgba(255,255,255,.5);pointer-events:none}
.ztag i{width:10px;height:10px;border-radius:50%;background:var(--ink-3);flex:none}
.ztag.ok i{background:var(--ok)}.ztag.no i{background:var(--bad)}.ztag.pay i{background:#F2C94C}
.ztag.ok{border-color:rgba(34,176,75,.7)}.ztag.no{border-color:rgba(224,52,44,.7)}.ztag.pay{border-color:rgba(242,201,76,.7)}
.ztag.sel{background:#fff;color:#111}
.ztag.reading{border-style:dashed;color:var(--ink-2)}
.ztag.reading i{animation:blink .5s steps(1) infinite;background:#fff}
.ztag em{font-style:normal;font-weight:500;opacity:.75}
.scan{position:absolute;right:24px;top:24px;bottom:24px;width:348px;z-index:4;border-radius:24px;background:var(--hud);border:1px solid var(--hud-line);box-shadow:0 20px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;padding:20px;gap:16px}
.scan[hidden]{display:none}
.scan-head{display:flex;align-items:center;gap:12px}
.scan-head img{width:60px;height:40px}
.scan-head small{display:block;font-size:13px;font-weight:700;color:var(--ok)}
.scan-head b{font-size:22px;font-weight:600}
.scan-sub{font-size:14px;color:var(--ink-2);margin-top:-8px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto}
.zrow{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;background:var(--modal);border:1.5px solid transparent;min-height:60px}
.zrow .zdot{width:12px;height:12px;border-radius:50%;background:var(--ink-3)}
.zrow.ok .zdot{background:var(--ok)}.zrow.no .zdot{background:var(--bad)}.zrow.pay .zdot{background:#F2C94C}
.zrow b{display:block;font-size:16px;font-weight:600}
.zrow b em{font-style:normal;font-weight:500;color:var(--ink-2);font-size:14px}
.zrow small{display:block;font-size:12.5px;line-height:1.3;color:var(--ink-3);margin-top:3px}
.zrow .zfree{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.zrow.ok .zfree,.zrow.pay .zfree{color:var(--ok)}
.zrow.no{opacity:.72}
.zrow.sel{border-color:#fff;background:var(--raise-2);opacity:1}
.zrow.wait{color:var(--ink-3);font-size:14px;grid-template-columns:12px 1fr}
.zrow.wait .zdot{animation:blink .6s steps(1) infinite}
button.zrow:hover{background:var(--raise-2)}
.scan-foot{display:flex;flex-direction:column;gap:12px}
.scan-msg{font-size:13.5px;line-height:1.35;color:var(--ink-2);min-height:18px}
.scan-foot .btn{width:100%}
.scan-big{display:flex;flex-direction:column;gap:6px;flex:1;justify-content:center}
.scan-big .ms{font-size:44px;color:var(--ok)}
.scan-big b{font-size:26px;font-weight:600;line-height:1.1}
.scan-big p{margin:0;font-size:15px;line-height:1.4;color:var(--ink-2)}
.scan-big .pill{align-self:flex-start;height:36px;padding:0 14px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;background:var(--ok-soft);color:var(--ok);margin-top:6px}
.scan-big .pill.pay{background:rgba(242,201,76,.16);color:#F2C94C}
.remind{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;padding:12px 14px;border-radius:16px;background:var(--modal)}
.pip{position:absolute;left:24px;bottom:88px;width:340px;height:212px;z-index:3;border-radius:18px;border:1.5px solid rgba(255,255,255,.35);overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.5)}
.pip[hidden]{display:none}
.pip label{position:absolute;left:10px;top:10px;height:28px;padding:0 10px;border-radius:14px;background:rgba(0,0,0,.6);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.pip label i{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink 1.2s steps(1) infinite}
.pip svg{position:absolute;inset:0;width:100%;height:100%}
/* what shows in each phase of the ride */
.drive.ph-scan .turn,.drive.ph-choose .turn,.drive.ph-park .turn,.drive.ph-parked .turn,.drive.ph-arrived .turn,.drive.ph-preview .turn{display:none}
.drive:not(.ph-drive) .trip,.drive:not(.ph-drive) .speed,.drive:not(.ph-drive):not(.ph-preview) #simMult,.drive:not(.ph-drive) #simSkip{display:none}
.drive.ph-scan .dim-toggle,.drive.ph-choose .dim-toggle,.drive.ph-park .dim-toggle,.drive.ph-parked .dim-toggle,.drive.ph-arrived .dim-toggle,.drive.ph-preview .dim-toggle{display:none}
.drive.ph-scan .sim,.drive.ph-choose .sim,.drive.ph-park .sim,.drive.ph-parked .sim,.drive.ph-arrived .sim{left:24px;right:396px}
.drive.ph-preview .sim{left:24px;right:24px}
.drive.ph-preview #simMult{display:none}

.test *,.test *::before,.test *::after{transition:none!important;animation:none!important}
.test .boot{display:none}

/* ================= v3: minimal ManiScan on the move, music pill ================= */
.drive .turn,.drive .trip,.drive #simMult,.drive #simSkip,.drive .dim-toggle{display:none}
.drive.ph-drive .turn,.drive.ph-drive .trip,.drive.ph-drive #simMult,.drive.ph-drive #simSkip,.drive.ph-drive .dim-toggle{display:flex}
.drive.ph-drive .trip{display:grid}
.drive .speed{display:none}.drive.ph-drive .speed,.drive.ph-cruise .speed{display:flex}
.drive.ph-cruise .sim,.drive.ph-stopped .sim,.drive.ph-park .sim,.drive.ph-parked .sim,.drive.ph-arrived .sim{left:24px;right:auto;width:360px}
.drive.ph-preview .sim{left:24px;right:24px}
.mscan{position:absolute;right:24px;top:24px;z-index:3;height:48px;padding:0 18px 0 10px;border-radius:24px;display:flex;align-items:center;gap:10px;background:var(--hud);border:1px solid var(--hud-line);font-size:15px;font-weight:600;color:var(--ink)}
.mscan[hidden]{display:none}
.mscan img{width:40px;height:27px}
.dock{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:row-reverse;align-items:center;gap:12px;pointer-events:none}
.pa.go,.pa{height:56px}
.dock>*{pointer-events:auto}
.mpill{height:56px;padding:0 8px 0 8px;border-radius:28px;display:flex;align-items:center;gap:8px;background:var(--hud);border:1px solid var(--hud-line);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.mpill .cover{width:40px;height:40px;border-radius:20px;font-size:13px}
.mp-txt{display:flex;flex-direction:column;min-width:0;width:150px;line-height:1.15;padding-right:4px}
.mp-txt b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-txt small{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpill .pbtn{width:40px;height:40px}
.parkact[hidden]{display:none}
.pa{height:64px;padding:0 28px 0 22px;border-radius:32px;display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600;background:var(--hud);border:1px solid var(--hud-line);color:var(--ink);box-shadow:0 12px 28px rgba(0,0,0,.4)}
.pa .ms{font-size:28px}
.pa.go{background:var(--ok);border-color:transparent;color:#fff;animation:pop .35s var(--ease)}
.pa.go em{font-style:normal;font-size:15px;font-weight:600;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.18)}
.pa.prog{gap:16px;padding:0 10px 0 24px;min-width:320px}
.pa.done{gap:12px;padding:0 10px 0 20px;font-size:17px}
.pa.done .ms{color:var(--accent)}
.pbar{flex:1;height:6px;border-radius:3px;background:var(--track-bg);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s linear}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--ok)}.pdot.pay{background:#E8B931}.pdot.no{background:var(--bad)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.ztag{height:34px;padding:0 12px 0 9px;gap:7px;font-size:15px;font-weight:700}
.ztag .ms{font-size:18px}
.ztag em{font-style:normal;font-weight:600;opacity:.85}
.ztag.reading{padding:0 9px;width:34px;justify-content:center}
.ztag.nope{animation:nope .45s}
@keyframes nope{20%,60%{translate:-6px 0;background:var(--bad)}40%,80%{translate:6px 0}}
.drive.ph-park .mpill,.drive.ph-parked .mpill{display:none}
.drive .pip{left:24px;bottom:96px}


/* ================= v3: light mode ================= */
#app[data-theme="light"]{
  color-scheme:light;
  --void:#e6e3df; --panel:#f6f4f1; --card:#ffffff; --raise:#ecE9e5; --raise-2:#dfdbd6; --line:rgba(0,0,0,.08);
  --ink:#1d1c1a; --ink-2:#56534e; --ink-3:#8c8882; --pill:#ffffff; --pill-ink:#3e3c3a; --pill-ink-2:#77736e;
  --hud:rgba(255,255,255,.93); --hud-line:rgba(0,0,0,.1); --bar:#ffffff; --modal:#ffffff; --sheet:rgba(250,249,247,.98);
  --note:#f1efec; --toast:#ffffff; --card2:#f3f1ee; --track-bg:#dcd8d3; --glass-veil:rgba(255,248,242,.62);
  background:var(--void);
}
#app[data-theme="light"] #stage{background:var(--void)}
#app[data-theme="light"] .glass::before{content:"";position:absolute;inset:0;background:var(--glass-veil);pointer-events:none}
#app[data-theme="light"] .panel{box-shadow:0 18px 40px rgba(60,40,20,.14)}
#app[data-theme="light"] .tile-nav::after{background:linear-gradient(transparent,rgba(255,255,255,.92))}
#app[data-theme="light"] .tile .go{background:rgba(0,0,0,.06)}
#app[data-theme="light"] .callout{background:rgba(0,0,0,.06)}
#app[data-theme="light"] .callout:hover{background:rgba(0,0,0,.1)}
#app[data-theme="light"] .grabber i{background:rgba(0,0,0,.25)}
#app[data-theme="light"] .key:active{background:#d2cec8}
#app[data-theme="light"] .key.light{background:#1d1c1a;color:#fff}
#app[data-theme="light"] .tbtn{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.55)}
#app[data-theme="light"] .tbtn.on{box-shadow:none}
#app[data-theme="light"] .zones button{color:var(--ink-3)}
#app[data-theme="light"] .cabin path,#app[data-theme="light"] .cabin rect{filter:invert(1) hue-rotate(180deg)}
#app[data-theme="light"] .seat-btn{background:rgba(255,255,255,.7);color:var(--ink);border-color:rgba(0,0,0,.15)}
#app[data-theme="light"] .call-ov{background:radial-gradient(80% 80% at 50% 30%,#fbe2d6,#f6f4f1 70%)}
#app[data-theme="light"] .pa.go{color:#fff}
#app[data-theme="light"] .mani-card{background:var(--sheet)}
#app[data-theme="light"] .lock-chip.open{color:#c02a20}
#app[data-theme="light"] .credit{color:#8c8882}

/* ================= v3: view transitions — quick, with a little depth ================= */
.view{transform:scale(.965) translateY(10px);filter:blur(6px);transition:opacity .26s cubic-bezier(.3,.7,.2,1),transform .42s cubic-bezier(.16,1,.3,1),filter .3s ease,visibility 0s .42s}
.view.on{transform:none;filter:none;transition:opacity .3s cubic-bezier(.3,.7,.2,1) .04s,transform .46s cubic-bezier(.16,1,.3,1),filter .34s ease,visibility 0s}
.view.out{opacity:0;transform:scale(1.025);filter:blur(5px);transition:opacity .2s ease,transform .3s cubic-bezier(.4,0,.6,1),filter .24s ease,visibility 0s .3s}
.view.flush{filter:none}
.view.flush:not(.on){transform:scale(.985)}
.test .view{filter:none!important}

/* ================= v3: search breathes, keyboard is compact ================= */
.kbd{padding:14px 20px 16px;gap:6px}
.key{height:42px;border-radius:10px;font-size:17px}
.key .ms{font-size:21px}
.search.open{height:68px}
.results{top:92px;padding:4px 24px 10px;max-height:300px}
.res{padding:14px 2px;gap:18px}
.res b{font-size:19px}
.res small{font-size:14px;margin-top:3px}
.res .ms{font-size:26px}
.res .thumb{width:56px;height:40px;border-radius:10px;flex:none;background:#ccc center/cover}
.cats{padding:14px 0 12px;gap:10px}
.cat-chip{height:44px;padding:0 16px 0 12px;font-size:15.5px}

/* place card photo / live map fallback */
.fphoto{height:176px;margin:0 12px;border-radius:16px;position:relative;overflow:hidden;background:#d3cdc8 center/cover}
.fphoto small{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmap{height:176px;margin:0 12px;border-radius:16px;overflow:hidden;position:relative}
.fmap canvas{width:100%;height:100%;display:block}
.fmap small{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--hud);padding:3px 8px;border-radius:10px}
#app{color:var(--ink)}
.pa,.pa *{white-space:nowrap}
.sp-cover{color:rgba(255,255,255,.92)}

/* profiles: editable settings per driver */
.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:16px;min-height:62px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow>.ms{font-size:26px;color:var(--accent)}
.prow b{font-size:18px;font-weight:600}
.stepper{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}
.pdetail{gap:16px;padding:28px 32px}
.plist{overflow:auto}

/* ================= v4: hold-to-speed, finish card, seek, immersive views ================= */
.drive .sim{left:488px;right:auto;width:auto;height:56px;padding:0 6px;gap:6px;border-radius:28px}
.drive:not(.ph-drive):not(.ph-preview) .sim{display:none}
.drive.ph-preview .sim{left:24px;right:auto}
.ff{height:44px;padding:0 14px 0 10px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;transition:background .2s,color .2s}
.ff .ms{font-size:24px}
.ff kbd{font:inherit;font-size:12px;padding:2px 7px;border-radius:6px;border:1px solid var(--hud-line);background:var(--raise);margin:0 2px}
.ff b{font-weight:700;font-size:14px;color:var(--ink-2);min-width:30px}
.ff:hover{background:var(--raise)}
.ff.on{background:var(--accent);color:#fff}.ff.on b{color:#fff}.ff.on kbd{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15)}
.drive::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(120% 90% at 50% 55%,transparent 55%,rgba(0,0,0,.38))}
.drive.boost::before{opacity:1}
.mpill{position:relative}
.mp-seek{position:absolute;left:58px;right:18px;bottom:5px;height:10px;cursor:pointer;display:flex;align-items:center}
.mp-seek::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--track-bg)}
.mp-seek i{position:relative;display:block;height:3px;border-radius:2px;background:var(--ink);width:0}
.mp-txt{padding-bottom:4px}
/* the end of the ride: a calm card that rises once the camera starts circling */
.fin{display:flex;align-items:center;gap:16px;padding:14px 14px 14px 16px;border-radius:28px;background:var(--hud);border:1px solid var(--hud-line);box-shadow:0 18px 40px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:finIn 1.1s cubic-bezier(.16,1,.3,1) .9s both}
.fin-ic{width:52px;height:52px;border-radius:26px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.fin-ic.pay{background:rgba(242,201,76,.16);color:#E8B931}.fin-ic.no{background:rgba(224,52,44,.14);color:var(--bad)}
.fin-ic .ms{font-size:28px}
.fin-t{display:flex;flex-direction:column;line-height:1.2;min-width:200px;max-width:340px}
.fin-t small{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-t b{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-t span{font-size:13px;color:var(--ink-3);margin-top:2px}
.fin-rem{height:44px;padding:0 14px 0 10px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2);background:var(--raise)}
.fin-rem.on{color:var(--ink)}.fin-rem.on .ms{color:var(--accent)}
.fin-done{height:52px;padding:0 26px;border-radius:26px;font-size:17px}
@keyframes finIn{from{opacity:0;translate:0 26px;filter:blur(8px)}to{opacity:1;translate:0 0;filter:none}}
.drive.ph-parked .mscan,.drive.ph-arrived .mscan,.drive.ph-parked .d-left,.drive.ph-arrived .d-left{opacity:0;pointer-events:none}
.drive .d-left,.drive .mscan,.drive .speed{transition:opacity .8s ease}
.drive.ph-parked::after,.drive.ph-arrived::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.35),transparent 40%);animation:fadeIn 1.6s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* views open from the point you tapped, with a soft blur and a staggered rise */
.view{clip-path:circle(0% at var(--ox,50%) var(--oy,50%));transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(.94);filter:blur(10px);
  transition:clip-path .62s cubic-bezier(.22,1,.36,1),opacity .3s ease,transform .62s cubic-bezier(.16,1,.3,1),filter .45s ease,visibility 0s .62s}
.view.on{clip-path:circle(150% at var(--ox,50%) var(--oy,50%));transform:none;filter:none;
  transition:clip-path .62s cubic-bezier(.22,1,.36,1),opacity .25s ease,transform .62s cubic-bezier(.16,1,.3,1),filter .45s ease,visibility 0s}
.view.out{clip-path:circle(150% at var(--ox,50%) var(--oy,50%));opacity:0;transform:scale(1.03);filter:blur(8px);z-index:0;
  transition:opacity .4s ease,transform .55s cubic-bezier(.4,0,.6,1),filter .4s ease,visibility 0s .55s}
.view.on{z-index:1}
.view.flush:not(.on){transform:scale(.97)}
.view.flush.on{filter:none}
#v-drive.out.calm{transform:scale(1.08);filter:blur(14px);transition:opacity 1.3s ease .1s,transform 1.4s cubic-bezier(.4,0,.2,1),filter 1.2s ease,visibility 0s 1.4s}
#v-nav.on{transition:clip-path .62s cubic-bezier(.22,1,.36,1),opacity .5s ease,transform .9s cubic-bezier(.16,1,.3,1),filter .6s ease,visibility 0s}
.view.on:not(.flush)>*>*{animation:stg .6s cubic-bezier(.16,1,.3,1) backwards}
.view.on:not(.flush)>*>*:nth-child(2){animation-delay:.04s}.view.on:not(.flush)>*>*:nth-child(3){animation-delay:.08s}
.view.on:not(.flush)>*>*:nth-child(4){animation-delay:.12s}.view.on:not(.flush)>*>*:nth-child(5){animation-delay:.16s}
.view.on:not(.flush)>*>*:nth-child(n+6){animation-delay:.2s}
@keyframes stg{from{opacity:0;translate:0 16px;filter:blur(5px)}}
.test .view{clip-path:none!important;filter:none!important;transform:none!important}
.trip b{white-space:nowrap}
.fin-rem{white-space:nowrap}
.drive.ph-drive .trip{width:auto;grid-template-columns:repeat(3,auto);column-gap:26px;padding-right:24px}

/* ================= v5: frosted mirror glass, Baidu-style drive HUD, split search, Mani listens ================= */
#app{--fx-bg:linear-gradient(135deg,rgba(46,50,60,.6),rgba(20,22,28,.42));--fx-line:rgba(255,255,255,.2);--fx-hi:rgba(255,255,255,.34);--fx-ink:#fff;--fx-ink2:rgba(255,255,255,.7);--fx-sub:rgba(255,255,255,.1);--fx-sub2:rgba(255,255,255,.18);--fx-shadow:0 18px 44px rgba(0,0,0,.32);--fx-tag:#58d07a}
#app[data-theme="light"]{--fx-bg:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.52));--fx-line:rgba(255,255,255,.95);--fx-hi:#fff;--fx-ink:#1b1d22;--fx-ink2:rgba(27,29,34,.64);--fx-sub:rgba(20,30,50,.07);--fx-sub2:rgba(20,30,50,.13);--fx-shadow:0 18px 44px rgba(40,60,100,.2);--fx-tag:var(--ok-ink)}
#app .lg{background:var(--fx-bg);-webkit-backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);border:1px solid var(--fx-line);
  box-shadow:inset 0 1px 0 var(--fx-hi),inset 0 -1px 0 rgba(255,255,255,.07),inset 1px 0 0 rgba(255,255,255,.1),var(--fx-shadow);color:var(--fx-ink);--pill-ink:var(--fx-ink);--pill-ink-2:var(--fx-ink2)}
#app .lg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.05) 24%,transparent 44%,transparent 72%,rgba(255,255,255,.09) 100%)}
#app .lg.dk{--fx-bg:linear-gradient(135deg,rgba(24,34,66,.8),rgba(10,16,38,.64));--fx-line:rgba(255,255,255,.22);--fx-hi:rgba(255,255,255,.3);--fx-ink:#fff;--fx-ink2:rgba(255,255,255,.72)}
.zoom .stack,.zoom .solo,.turn,.trip,.then,.quit,.speed,.mani-say,.mani-btn{position:relative}
/* text and inner blocks follow the glass */
.lg .fhead .t,.lg .fname,.lg .fromto,.lg .fromto .ms,.lg .opt b,.lg .res b,.lg .cat-chip,.lg .guide-step b{color:var(--fx-ink)}
.lg .fromto,.lg .opt,.lg .cat-chip{background:var(--fx-sub)}
.lg .opt.on{background:var(--fx-sub2);border-color:var(--accent)}
.lg .opt:hover:not(.on),.lg .cat-chip:hover,#app .lg .fbtn:hover,#app .zoom .stack button:hover{background:var(--fx-sub2)}
.lg .opt .tag{color:var(--fx-tag);background:rgba(34,176,75,.16)}
.lg .fcircle{background:var(--fx-sub2);color:var(--fx-ink)}.lg .fcircle.on{background:var(--fx-ink);color:var(--panel)}.lg .fcircle.accent{background:var(--accent);color:#fff}
.lg .btn.dark{background:var(--fx-sub2);color:var(--fx-ink)}
.lg .res,.lg .res:first-child,.lg .cats,.lg .res-empty{border-top-color:var(--fx-sub2)}
.lg .res:hover b{color:var(--accent)}
.zoom .stack button+button{border-top-color:var(--fx-sub2)}
#app .zoom .solo.on{color:var(--accent)}
.fphoto small,.fmap small{position:absolute;right:8px;bottom:6px}

/* rail: picture (drivers + settings), navigation, phone */
.rail-nav{justify-content:flex-start;gap:22px}
.rail-btn.av-btn .av{box-shadow:0 0 0 2px rgba(255,255,255,.16);transition:box-shadow .25s}
.rail-btn.av-btn.on .av{box-shadow:0 0 0 3px var(--accent)}
#app[data-theme="light"] .rail-btn.av-btn .av{box-shadow:0 0 0 2px rgba(0,0,0,.12)}
#app[data-theme="light"] .rail-btn.av-btn.on .av{box-shadow:0 0 0 3px var(--accent)}

/* Mani: a big round button; what it hears and answers appears beside it */
.mani{position:absolute;right:24px;top:24px;z-index:12;display:none;align-items:flex-start;gap:12px;pointer-events:none}
.content[data-view="nav"] .mani,.content[data-view="drive"] .mani{display:flex}
.content.searching .mani{display:none}
#app .mani-btn{right:auto;top:auto;width:88px;height:88px;padding:0;border-radius:50%;display:grid;place-items:center;pointer-events:auto;flex:none;
  background:linear-gradient(150deg,#ff7a4a,var(--accent) 55%,#b9300f);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -8px 16px rgba(120,20,0,.35),0 14px 30px rgba(219,67,30,.4);-webkit-backdrop-filter:none;backdrop-filter:none;transition:transform .25s var(--ease),box-shadow .3s}
#app .mani-btn::before{background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,0) 46%)}
.mani-btn img{width:62px;height:42px;position:relative;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.mani-mic{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:background .2s,color .2s}
.mani-mic .ms{font-size:21px;color:inherit}
.mani[data-st="listening"] .mani-btn{animation:maniPulse 1.5s ease-out infinite}
.mani[data-st="listening"] .mani-mic{background:#1ED760;color:#04310f}
.mani[data-st="listening"] .mani-btn img{animation:bob 1.2s ease-in-out infinite}
@keyframes maniPulse{0%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 0 0 rgba(219,67,30,.55),0 14px 30px rgba(219,67,30,.4)}100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 0 26px rgba(219,67,30,0),0 14px 30px rgba(219,67,30,.4)}}
.mani-say{pointer-events:auto;max-width:520px;min-height:60px;margin-top:14px;padding:12px 22px 12px 18px;border-radius:30px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:500;line-height:1.3;animation:sayIn .4s var(--ease)}
.mani-say[hidden]{display:none}
@keyframes sayIn{from{opacity:0;translate:18px 0;filter:blur(6px)}}
.mani-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.mani-tx[hidden],.mani-in[hidden]{display:none}
.mani-tx small{font-size:13.5px;color:var(--fx-ink2)}
.mani-tx i{font-style:normal;opacity:.55}
.mani-tx em{font-style:normal;color:var(--fx-ink2)}
.mani-wave{display:none;gap:3px;align-items:center;height:24px;flex:none}
.mani[data-st="listening"] .mani-wave{display:flex}
.mani-wave i{width:3px;height:8px;border-radius:2px;background:var(--accent);animation:wv 1s ease-in-out infinite}
.mani-wave i:nth-child(2){animation-delay:.12s}.mani-wave i:nth-child(3){animation-delay:.24s}.mani-wave i:nth-child(4){animation-delay:.36s}
.mani-in{width:400px;background:transparent;border:0;outline:0;color:inherit;font:inherit;position:relative}
.mani-in::placeholder{color:var(--fx-ink2)}

/* search: keyboard on the left half, the field and a long list on the right half */

/* ---------- MANI: tap the mascot and talk. No pop-up: it listens, your words appear beside it, and it does what you said. ---------- */
const mani = { on: false, eng: null, mode: 'cmd', text: '', part: '', said: '', reply: '', status: '', t: null, quiet: null, hide: null };

  if (st === 'listening') tx.innerHTML = mani.text || mani.part ? `<span>${esc(mani.text)}<i>${esc(mani.part)}</i></span>` : '<em>Listening…</em>';
  else if (st === 'reply') tx.innerHTML = (mani.said ? `<small>“${esc(mani.said)}”</small>` : '') + `<span>${esc(mani.reply)}</span>`;

}
function maniStopEngine(eng) {

}
const maniQuiet = ms_ => { clearTimeout(mani.quiet); mani.quiet = setTimeout(() => { if (mani.on && mani.eng !== 'type') maniFinish(); }, ms_); };

/* voice is not available here (or was refused): the same pill becomes a text field */

/* what Mani understands */
const MCAT = [['charge', /\b(charg\w*|plug in|ev station)\b/], ['parking', /\b(parking|car ?park|place to park|somewhere to park)\b/], ['cafe', /\b(coffee|cafe|espresso|latte)\b/], ['restaurant', /\b(restaurants?|food|eat|lunch|dinner|hungry)\b/],
  ['grocery', /\b(grocer\w*|supermarket)\b/], ['fuel', /\b(gas|fuel|petrol)\b/], ['pharmacy', /\b(pharmac\w*|drugstore)\b/], ['hospital', /\b(hospital|emergency room|clinic)\b/], ['hotel', /\bhotels?\b/], ['bank', /\b(bank|atm)\b/], ['bar', /\b(bar|pub|drink)\b/], ['park', /\bpark\b/]];
/* the map speaks French: match English words to the names on the street ("Atwater Market" is Marché Atwater) */
const EN_FR = { market: 'marche', stadium: 'stade', olympic: 'olympique', museum: 'musee', library: 'bibliotheque', church: 'eglise', hospital: 'hopital', park: 'parc', street: 'rue', bridge: 'pont', university: 'universite', airport: 'aeroport', station: 'gare', train: 'gare',
  garden: 'jardin', botanical: 'botanique', mount: 'mont', mountain: 'mont', old: 'vieux', square: 'place', city: 'ville', school: 'ecole', beach: 'plage', island: 'ile', st: 'saint', cathedral: 'cathedrale', basilica: 'basilique', theater: 'theatre', center: 'centre', science: 'sciences', tower: 'tour', fine: 'beaux', arts: 'arts', lake: 'lac', canal: 'canal', hall: 'hotel' };
const M_STOP = new Set(['the', 'of', 'de', 'du', 'la', 'le', 'les', 'des', 'a', 'an', 'to', 'at', 'in', 'on', 'and', 'et', 'd', 'l']);
function maniFind(q, generic) {
  const n = GEO.norm(q), words = n.split(' ').filter(w => w.length > 1 && !M_STOP.has(w)), fr = words.map(w => EN_FR[w] || w), cat = MCAT.find(c => c[1].test(n));
  const near = () => cat && GEO.nearby(cat[0], S.me, 1)[0];
  if (generic && near()) return near();
  let best = null, bs = 0;
  for (const qq of new Set([q, fr.join(' '), words.join(' ')].concat(fr.length > 1 ? fr : []))) GEO.search(qq, S.me, 8).forEach((h, i) => {
    const hn = ' ' + GEO.norm(h.name) + ' '; let sc = 0; words.forEach((w, k) => { if (hn.includes(w) || hn.includes(fr[k])) sc++; });
    sc -= i * 0.01 + Math.max(0, hn.trim().split(' ').length - words.length) * 0.02; if (sc > bs) { bs = sc; best = h; }
  });

}
function maniDo(raw) {
  const t = raw.toLowerCase().replace(/[’‘]/g, "'").replace(/[.!?,;:"“”]/g, ' ').replace(/\s+/g, ' ').trim(), D = S.drive, has = re => re.test(t);
  let m;
  if (!t) return 'I didn’t catch that.';
  if (has(/^(hi|hello|hey|bonjour|salut)( mani| there)?$/)) return 'Hi! Tell me where you want to go.';
  if (has(/^(thanks|thank you|merci)\b/)) return 'Anytime.';
  if (has(/\b(what can you do|help)\b/)) return 'Try “take me to Atwater Market”, “find coffee”, “call Léa”, “dark mode” or “end the trip”.';
  // trip control
  if (has(/\b(stop|end|cancel|quit|abort)\b.*\b(navigation|route|trip|drive|guidance|ride)\b/) || has(/^(stop|cancel|end|never mind|nevermind)( it| that)?$/)) {
    if (D) { endDrive('quit'); return 'Okay, I ended the trip.'; }
    if (S.nav.mode !== 'browse') { navReset(); return 'Okay, cleared.'; }
    return 'There’s no trip to stop.';
  }
  if (D) {
    if (has(/\bpark\b/) && !has(/\b(find|parking lot|garage)\b/)) {
      if (D.ph === 'cruise' || D.ph === 'stopped') { if (world.sel) { world.park(); driveUI('park'); return 'Parking in the free spot.'; } return 'No free spot yet. I’m still reading the signs.'; }
      return D.ph === 'drive' ? 'I’ll find you a spot when we reach the street.' : 'Already on it.';
    }
    if (has(/\b(go around|try again|another (spot|place))\b/) && D.ph === 'stopped') { world.again(); driveUI('cruise'); return 'Going around again.'; }
    if (has(/\b(skip|fast forward|hurry|faster|speed up)\b/)) { world.skip(); return 'Skipping ahead.'; }
    if (has(/\b(2 ?d|two d|from above|top view|map view|bird'?s eye)\b/)) { world.setView('2d'); $$('#dimT button').forEach(b => b.classList.toggle('on', b.dataset.v === '2d')); return 'Top view.'; }
    if (has(/\b(3 ?d|three d|behind the car)\b/)) { world.setView('3d'); $$('#dimT button').forEach(b => b.classList.toggle('on', b.dataset.v === '3d')); return 'Back to 3D.'; }
    if (has(/\b(how long|how far|eta|when (do|will) we (arrive|get there)|are we there)\b/)) return D.ph === 'drive' ? `${hud.dMin || 'A few'} min left. We arrive around ${hud.dEta || 'soon'}.` : 'We’re there.';
    if (has(/\b(done|finish|i'?m done)\b/) && (D.ph === 'parked' || D.ph === 'arrived')) { endDrive(D.ph); return 'See you soon.'; }
  }
  // screen
  if (has(/\b(dark|night)\b.*\b(mode|theme)\b/) || has(/\b(mode|theme)\b.*\b(dark|night)\b/)) { maniTheme('dark'); return 'Dark mode on.'; }
  if (has(/\b(light|day|bright)\b.*\b(mode|theme)\b/) || has(/\b(mode|theme)\b.*\b(light|day)\b/)) { maniTheme('light'); return 'Light mode on.'; }
  if (S.view === 'nav' && mapV) {
    if (has(/\bzoom in\b|\bcloser\b/)) { mapV.zoomAt(1.8, undefined, undefined, true); return 'Zooming in.'; }
    if (has(/\bzoom out\b|\bfarther\b|\bfurther\b/)) { mapV.zoomAt(1 / 1.8, undefined, undefined, true); return 'Zooming out.'; }
  }
  if (has(/\b(where am i|recenter|center the map|my location|my position)\b/)) { if (!D) { go('nav'); navReset(); } return `You’re on ${GEO.roadNameNear(S.me[0], S.me[1]) || 'the map'}.`; }
  if (has(/\bwhat time\b/)) return `It’s ${hhmm(new Date())}.`;
  // phone
  if (has(/\b(hang up|end (the )?call)\b/)) { if (S.call) { endCall(); return 'Call ended.'; } return 'You’re not on a call.'; }
  if ((m = t.match(/\b(?:call|phone|dial|ring)\s+(.+)/))) {
    const who = GEO.norm(m[1]), c = CONTACTS.find(c => who.includes(GEO.norm(c.name)));
    if (c) { setTimeout(() => startCall(c.id), 900); return `Calling ${c.name}.`; }
    return `I don’t have “${m[1]}” in your contacts.`;
  }
  // pages
  if (has(/\b(open|show|go to)\b.*\b(phone|contacts|calls)\b/)) { go('phone'); return 'Here’s your phone.'; }
  if (has(/\b(open|show|go to)\b.*\b(settings|profile|drivers?)\b/)) { go('profile'); return 'Here are your settings.'; }
  if (has(/\b(open|show|go to)\b.*\b(spotify|music)\b/)) { go('spotify'); return 'Here’s Spotify.'; }
  if (has(/\b(open|show|go to)\b.*\b(map|navigation)\b/)) { go('nav'); return 'Here’s the map.'; }
  if (has(/\b(unmute)\b/)) { if (S.muted) toggleMute(); return 'Sound on.'; }
  if (has(/\b(mute|silence|quiet)\b/)) { if (!S.muted) toggleMute(); return 'Muted.'; }
  if (has(/\b(louder|volume up|turn it up)\b/)) { setVol((S.muted ? 0 : S.vol) + 15); return `Volume ${S.vol}.`; }
  if (has(/\b(softer|quieter|lower|volume down|turn it down)\b/)) { setVol(S.vol - 15); return `Volume ${S.vol}.`; }
  if (has(/\b(next (song|track)|skip (this )?(song|track))\b/)) { next(); if (!S.playing) togglePlay(); return `Playing ${tr().t}.`; }
  if (has(/\b(previous (song|track)|last song|go back a song)\b/)) { playTrack(S.track - 1); return `Playing ${tr().t}.`; }
  if (has(/\b(pause|stop (the )?music)\b/)) { if (S.playing) togglePlay(); return 'Paused.'; }
  if (has(/\b(play|resume|music|song)\b/)) { if (!S.playing) togglePlay(); return `Playing ${tr().t}, ${tr().a}.`; }
  // start what is already on screen

  const find = !nav && t.match(/^(?:please |mani |hey mani |ok mani |okay mani )*(?:find|search for|search|show me|show|where is|where'?s|where are|look for|look up|i need|i want|is there|are there)\s+(.+)$/);

  if (D) return 'We’re already driving. Say “end the trip” first.';
  go('nav');

}
function maniTheme(th) { S.set.theme = th; const cur = S.profiles.find(p => p.id === S.profile); if (cur) cur.theme = th; applyTheme(); if (S.view === 'profile') renderSettings(); }

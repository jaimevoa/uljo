      <!-- IDEAS -->
      <section class="screen active" id="screen-home">
        <header class="top">
          <div class="head"><h1 class="title">Ideas</h1><div class="head-icons"><button class="icon-btn do-search" aria-label="Search"><i class="ph ph-magnifying-glass"></i></button><button class="icon-btn desk-only go-profile" aria-label="Profile"><i class="ph ph-user-circle"></i></button></div></div>
          <div class="search"><i class="ph ph-magnifying-glass"></i><input data-scope="home" placeholder="Search ideas and lyrics" autocomplete="off" /><button class="search-cancel">Cancel</button></div>
          <div class="chips" id="homeChips"></div>
        </header>
        <div class="body" id="homeBody"><div class="list" id="ideasList"></div><div class="empty" id="homeEmpty" hidden></div></div>
      </section>

      <!-- SONG -->
      <section class="screen" id="screen-song">
        <header class="top">
          <div class="bar">
            <button class="icon-btn" data-back aria-label="Back"><i class="ph ph-caret-left"></i></button>
            <div class="seg" id="songTabs"><button class="seg-btn active" data-tab="song">Song</button><button class="seg-btn" data-tab="mood">Moodboard</button></div>
            <button class="icon-btn" id="songShare" aria-label="Send to a friend"><i class="ph ph-paper-plane-tilt"></i></button>
          </div>
        </header>
        <div class="body song-body" id="songBody">
          <article class="song-card" id="songCard">
            <div class="song-head">
              <button class="cover" id="songCover" aria-label="Add a picture"><i class="ph ph-image"></i></button>
              <div class="song-meta"><input class="song-title" id="songTitle" placeholder="Name this idea" autocomplete="off" /><div class="song-sub" id="songSub"></div></div>
              <button class="icon-btn" id="songMore" aria-label="More"><i class="ph ph-dots-three"></i></button>
            </div>
            <div id="songPane"></div>
          </article>
        </div>
        <footer class="dock" id="dock"></footer>
      </section>

      <!-- INSPIRATION -->
      <section class="screen" id="screen-insp">
        <header class="top">
          <div class="head"><h1 class="title">Inspiration</h1><div class="head-icons"><button class="icon-btn do-search" aria-label="Search"><i class="ph ph-magnifying-glass"></i></button><button class="icon-btn desk-only go-profile" aria-label="Profile"><i class="ph ph-user-circle"></i></button></div></div>
          <div class="search"><i class="ph ph-magnifying-glass"></i><input data-scope="insp" placeholder="Search notes and links" autocomplete="off" /><button class="search-cancel">Cancel</button></div>
          <div class="chips" id="boardChips"></div>
        </header>
        <div class="body"><div class="grid" id="inspGrid"></div><div class="empty" id="inspEmpty" hidden></div></div>
        <button class="fab" id="inspAdd" aria-label="Add inspiration"><i class="ph ph-plus"></i></button>
      </section>

      <!-- FRIENDS -->
      <section class="screen" id="screen-friends">
        <header class="top">
          <div class="head"><h1 class="title">Friends</h1><div class="head-icons"><button class="icon-btn" id="newMsg" aria-label="New message"><i class="ph ph-note-pencil"></i></button><button class="icon-btn desk-only go-profile" aria-label="Profile"><i class="ph ph-user-circle"></i></button></div></div>
          <div class="seg seg-wide" id="friendTabs"><button class="seg-btn active" data-ftab="chats">Chats</button><button class="seg-btn" data-ftab="feed">Feed</button></div>
        </header>
        <div class="body"><div id="chatsPanel"></div><div id="feedPanel" hidden></div></div>
      </section>

      <!-- CONVERSATION -->
      <section class="screen" id="screen-chat">
        <header class="top"><div class="bar"><button class="icon-btn" data-back aria-label="Back"><i class="ph ph-caret-left"></i></button><div class="chat-who" id="chatWho"></div><span class="icon-btn-space"></span></div></header>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-bar"><button class="icon-btn" id="chatShare" aria-label="Share an idea"><i class="ph ph-plus"></i></button><input id="chatInput" placeholder="Message" autocomplete="off" /><button class="send" id="chatSend" aria-label="Send"><i class="ph-bold ph-arrow-up"></i></button></div>
      </section>

      <!-- PROFILE -->
      <section class="screen" id="screen-profile">
        <header class="top"><div class="head"><h1 class="title">Profile</h1></div></header>
        <div class="body" id="profileBody"></div>
      </section>

      <!-- TAB BAR / SIDEBAR -->
      <nav class="tabbar" id="tabbar">
        <svg class="logo tb-logo desk-only" viewBox="0 0 371.49 83.75" role="img" aria-label="track on"><use href="#logo"/></svg>
        <button class="tb tb-line" data-tb="home"><i class="ph-bold ph-waveform"></i><span class="tb-label">Ideas</span></button>
        <button class="tb" data-tb="friends"><i class="ph-bold ph-users"></i><i class="ph-fill ph-users"></i><span class="tb-label">Friends</span></button>
        <button class="tb-rec" id="tbRecord" aria-label="New recording"></button>
        <button class="tb" data-tb="insp"><i class="ph-bold ph-sparkle"></i><i class="ph-fill ph-sparkle"></i><span class="tb-label">Inspiration</span></button>
        <button class="tb mob-only" data-tb="profile"><i class="ph-bold ph-user-circle"></i><i class="ph-fill ph-user-circle"></i><span class="tb-label">Profile</span></button>
      </nav>

      <!-- ONE SHEET FOR EVERY POP-UP -->
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-card" id="sheetCard"></div></div>

      <!-- ONBOARDING -->
      <div class="onboard" id="onboard" hidden></div>

      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
